name: 'Generate Chunks'
description: 'Generates chunks of URLs from a sitemap'

inputs:
  sitemap-url:
    description: 'Sitemap URL to process'
    required: true
  chunk-size:
    description: 'Number of URLs per chunk'
    required: false
    default: '50'
  output-dir:
    # Not a dot-directory, since upload-artifact skips hidden files by default
    description: 'Directory the chunk files are written to'
    required: false
    default: 'ia-chunks'

outputs:
  matrix:
    description: 'JSON array of chunk indices, suitable for a job matrix'
  chunk-dir:
    description: 'Directory containing the chunk-<index>.json files'

runs:
  using: 'node24'
  main: 'index.ts'
